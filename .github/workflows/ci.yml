name: CI Sรฉcuritรฉ

on: push

jobs:
  Dรฉpendances:
    runs-on: ubuntu-latest
    steps:
      - name: Rรฉcupรฉrer le code
        uses: actions/checkout@v4

      - name: Scan requirements.txt avec Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: requirements.txt
          severity: HIGH,CRITICAL
          exit-code: 1

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dรฉpendances
    steps:
      - name: Rรฉcupรฉrer le code
        uses: actions/checkout@v4

      - name: Scan Dockerfile avec Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1