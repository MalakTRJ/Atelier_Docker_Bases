name: CI Sécurité

on:
  push:
  pull_request:

jobs:
  Dependances:
    name: Dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan de requirements.txt avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'requirements.txt'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  Dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - uses: actions/checkout@v4

      - name: Scan du Dockerfile avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'